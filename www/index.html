<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#891E2B">
  <title>わせわせ</title>
  <link rel="stylesheet" href="css/splash_screen.css">
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #891E2B;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #fff;
    }
    .local-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.9); }
    a { color: #fff; font-weight: 700; }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.35);
      font-size: 13px;
    }
  </style>
  <script>
    (function () {
      try {
        var isNative =
          window.Capacitor &&
          typeof window.Capacitor.isNativePlatform === "function" &&
          window.Capacitor.isNativePlatform();
        if (!isNative) return;
        if (sessionStorage.getItem("wase_splash_done") === "1") return;
        document.documentElement.classList.add("is-native-capacitor", "wase-splash-pending");
        function mount() {
          if (document.getElementById("splash-screen")) return;
          var root = document.createElement("div");
          root.id = "splash-screen";
          root.setAttribute("aria-hidden", "true");
          root.innerHTML =
            '<div class="splash-screen__brand">' +
            '<img class="splash-screen__logo" src="assets/splash-logo.svg" alt="わせわせ" width="220" height="192">' +
            "</div>" +
            '<p class="splash-screen__footer">Anonymous Waseda Developer</p>';
          document.body.appendChild(root);
          window.__waseSplashMountedAt = Date.now();
        }
        if (document.body) mount();
        else document.addEventListener("DOMContentLoaded", mount, { once: true });
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="local-shell">
    <h1>わせわせ</h1>
    <p>Capacitor のローカル Web アセットが読み込まれています。</p>
    <p>本番ではリモート URL のタイムラインへ接続します。</p>
    <p class="badge" id="platform">読み込み中…</p>
    <p style="margin-top: 20px;">
      <a href="https://wasewase.onrender.com/">本番サイトをブラウザで開く</a>
    </p>
  </div>
  <script src="js/admob_config.js"></script>
  <script src="js/splash_screen.js" defer></script>
  <script src="js/capacitor_native.js" defer></script>
  <script>
    (function () {
      var el = document.getElementById("platform");
      var isNative =
        window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === "function" &&
        window.Capacitor.isNativePlatform();
      el.textContent = isNative
        ? "ネイティブアプリ（Capacitor）で起動中"
        : "Web ブラウザで表示中";
    })();
  </script>
</body>
</html>

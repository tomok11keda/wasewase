<script>
(function () {
  "use strict";

  var modal = document.getElementById("timetable-slot-modal");
  var form = document.getElementById("timetable-slot-form");
  if (!modal || !form) {
    return;
  }

  var titleEl = document.getElementById("timetable-slot-modal-title");
  var subtitleEl = document.getElementById("timetable-slot-modal-subtitle");
  var keyInput = document.getElementById("timetable-slot-key");
  var kindInput = document.getElementById("timetable-slot-kind");
  var nameInput = document.getElementById("timetable-slot-name");
  var roomInput = document.getElementById("timetable-slot-room");
  var roomField = document.getElementById("timetable-room-field");
  var creditsInput = document.getElementById("timetable-slot-credits");
  var memoInput = document.getElementById("timetable-slot-memo");
  var clearBtn = document.getElementById("timetable-slot-clear");
  var apiUrl = window.__WASE_TIMETABLE_SLOT_API__ || "";
  var store = {};

  function emptyEntry() {
    return { name: "", room: "", credits: "", memo: "" };
  }

  function getCsrfToken() {
    var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : "";
  }

  function loadInitialStore() {
    var el = document.getElementById("timetable-initial-data");
    if (!el) {
      return {};
    }
    try {
      var parsed = JSON.parse(el.textContent || "{}");
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (error) {
      return {};
    }
  }

  store = loadInitialStore();

  function getEntry(slotKey) {
    var entry = store[slotKey];
    if (!entry || typeof entry !== "object") {
      return emptyEntry();
    }
    return {
      name: String(entry.name || "").trim(),
      room: String(entry.room || "").trim(),
      credits: String(entry.credits || "").trim(),
      memo: String(entry.memo || "").trim(),
    };
  }

  function applyLocalEntry(slotKey, entry) {
    var normalized = {
      name: String(entry.name || "").trim(),
      room: String(entry.room || "").trim(),
      credits: String(entry.credits || "").trim(),
      memo: String(entry.memo || "").trim(),
    };
    if (!normalized.name && !normalized.room && !normalized.credits && !normalized.memo) {
      delete store[slotKey];
    } else {
      store[slotKey] = normalized;
    }
    return normalized;
  }

  function saveEntryRemote(slotKey, entry) {
    if (!apiUrl) {
      return Promise.resolve(applyLocalEntry(slotKey, entry));
    }
    return fetch(apiUrl, {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCsrfToken(),
      },
      body: JSON.stringify({
        slot_key: slotKey,
        name: entry.name || "",
        room: entry.room || "",
        credits: entry.credits || "",
        memo: entry.memo || "",
      }),
    }).then(function (res) {
      return res.json().then(function (payload) {
        if (!res.ok || !payload || !payload.ok) {
          throw new Error((payload && payload.error) || "save_failed");
        }
        var saved = payload.entry || emptyEntry();
        return applyLocalEntry(slotKey, saved);
      });
    });
  }

  function metaText(entry, kind) {
    if (kind === "od") {
      if (entry.credits) {
        return entry.credits + "単位";
      }
      return entry.name ? "OD" : "";
    }
    if (entry.room) {
      return entry.room;
    }
    if (entry.credits) {
      return entry.credits + "単位";
    }
    return "";
  }

  function renderSlot(button, entry) {
    if (!button) {
      return;
    }
    var kind = button.getAttribute("data-slot-kind") || "period";
    var name = entry.name || "";
    var meta = metaText(entry, kind);
    button.classList.toggle("is-filled", Boolean(name));
    button.classList.toggle("is-empty", !name);
    button.innerHTML = "";
    if (name) {
      var nameEl = document.createElement("p");
      nameEl.className = "timetable-class__name";
      nameEl.setAttribute("data-slot-name", "");
      nameEl.textContent = name;
      button.appendChild(nameEl);
      if (meta) {
        var metaEl = document.createElement("p");
        metaEl.className = "timetable-class__meta";
        metaEl.setAttribute("data-slot-meta", "");
        metaEl.textContent = meta;
        button.appendChild(metaEl);
      }
    } else {
      var placeholder = document.createElement("p");
      placeholder.className = "timetable-slot__placeholder";
      placeholder.setAttribute("data-slot-placeholder", "");
      placeholder.textContent = kind === "od" ? "OD" : "＋";
      button.appendChild(placeholder);
    }
  }

  function hydrateAllSlots() {
    document.querySelectorAll("[data-timetable-slot]").forEach(function (button) {
      var slotKey = button.getAttribute("data-slot-key");
      if (!slotKey) {
        return;
      }
      renderSlot(button, getEntry(slotKey));
    });
  }

  function openModal(button) {
    var slotKey = button.getAttribute("data-slot-key");
    var kind = button.getAttribute("data-slot-kind") || "period";
    var dayLabel = button.getAttribute("data-day-label") || "";
    var periodLabel = button.getAttribute("data-period-label") || "";
    var entry = getEntry(slotKey);

    keyInput.value = slotKey;
    kindInput.value = kind;
    nameInput.value = entry.name;
    roomInput.value = entry.room;
    creditsInput.value = entry.credits;
    memoInput.value = entry.memo;

    if (kind === "od") {
      titleEl.textContent = "オンデマンド授業";
      roomField.hidden = true;
      roomInput.value = "";
    } else {
      titleEl.textContent = "授業詳細";
      roomField.hidden = false;
    }
    subtitleEl.textContent = dayLabel
      ? dayLabel + "曜・" + periodLabel
      : periodLabel;

    modal.hidden = false;
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("timetable-modal-open");
    window.setTimeout(function () {
      nameInput.focus();
    }, 10);
  }

  function closeModal() {
    modal.hidden = true;
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("timetable-modal-open");
  }

  function setSaving(isSaving) {
    var submitBtn = form.querySelector('button[type="submit"]');
    if (submitBtn) {
      submitBtn.disabled = Boolean(isSaving);
    }
    if (clearBtn) {
      clearBtn.disabled = Boolean(isSaving);
    }
  }

  document.addEventListener("click", function (event) {
    var slot = event.target.closest("[data-timetable-slot]");
    if (slot) {
      openModal(slot);
      return;
    }
    if (event.target.closest("[data-timetable-modal-close]")) {
      closeModal();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !modal.hidden) {
      closeModal();
    }
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var slotKey = keyInput.value;
    var kind = kindInput.value || "period";
    var entry = {
      name: nameInput.value,
      room: kind === "od" ? "" : roomInput.value,
      credits: creditsInput.value,
      memo: memoInput.value,
    };
    setSaving(true);
    saveEntryRemote(slotKey, entry)
      .then(function (saved) {
        var button = document.querySelector(
          '[data-timetable-slot][data-slot-key="' + slotKey + '"]'
        );
        renderSlot(button, saved);
        closeModal();
      })
      .catch(function () {
        window.alert("時間割の保存に失敗しました。通信環境を確認して再度お試しください。");
      })
      .finally(function () {
        setSaving(false);
      });
  });

  if (clearBtn) {
    clearBtn.addEventListener("click", function () {
      nameInput.value = "";
      roomInput.value = "";
      creditsInput.value = "";
      memoInput.value = "";
      var slotKey = keyInput.value;
      setSaving(true);
      saveEntryRemote(slotKey, emptyEntry())
        .then(function (saved) {
          var button = document.querySelector(
            '[data-timetable-slot][data-slot-key="' + slotKey + '"]'
          );
          renderSlot(button, saved);
          closeModal();
        })
        .catch(function () {
          window.alert("時間割の削除に失敗しました。通信環境を確認して再度お試しください。");
        })
        .finally(function () {
          setSaving(false);
        });
    });
  }

  hydrateAllSlots();
})();
</script>

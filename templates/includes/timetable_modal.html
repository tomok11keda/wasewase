<style>
  #timetable-slot-modal .compose-modal__panel {
    max-height: min(92vh, 640px);
  }
  #timetable-slot-modal .compose-image-field {
    margin-bottom: 12px;
  }
  #timetable-slot-modal label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 700;
  }
  #timetable-slot-modal .timetable-modal-hint {
    margin: 0 0 12px;
    font-size: 12px;
    color: #888;
    line-height: 1.5;
  }
  #timetable-slot-modal .timetable-modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  #timetable-slot-modal .timetable-modal-actions .btn-compose {
    flex: 1;
  }
  #timetable-slot-modal .btn-timetable-clear {
    flex: 0 0 auto;
    min-width: 88px;
    height: 44px;
    padding: 0 14px;
    border: 1px solid #d0d7de;
    border-radius: 999px;
    background: #fff;
    color: #536471;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  #timetable-slot-modal textarea {
    min-height: 96px;
  }
  #timetable-slot-modal .room-field[hidden] {
    display: none;
  }
</style>

<div id="timetable-slot-modal" class="compose-modal" hidden aria-hidden="true">
  <div class="compose-modal__backdrop" data-timetable-modal-close></div>
  <div class="compose-modal__panel" role="dialog" aria-modal="true" aria-labelledby="timetable-slot-modal-title">
    <header class="compose-modal__header">
      <h2 id="timetable-slot-modal-title">授業詳細</h2>
      <button type="button" class="compose-modal__close" data-timetable-modal-close aria-label="閉じる">×</button>
    </header>
    <p class="timetable-modal-hint" id="timetable-slot-modal-subtitle"></p>
    <form id="timetable-slot-form" novalidate>
      <input type="hidden" id="timetable-slot-key" name="slot_key" value="">
      <input type="hidden" id="timetable-slot-kind" name="kind" value="">
      <div class="compose-image-field">
        <label for="timetable-slot-name">授業名</label>
        <input id="timetable-slot-name" name="name" type="text" maxlength="80" placeholder="例：マクロ経済学" autocomplete="off">
      </div>
      <div class="compose-image-field room-field" id="timetable-room-field">
        <label for="timetable-slot-room">教室</label>
        <input id="timetable-slot-room" name="room" type="text" maxlength="40" placeholder="例：11-503" autocomplete="off">
      </div>
      <div class="compose-image-field">
        <label for="timetable-slot-credits">単位数</label>
        <input id="timetable-slot-credits" name="credits" type="text" inputmode="decimal" maxlength="8" placeholder="例：2" autocomplete="off">
      </div>
      <div class="compose-image-field">
        <label for="timetable-slot-memo">進捗・課題メモ</label>
        <textarea id="timetable-slot-memo" name="memo" maxlength="500" placeholder="課題の締切や進捗をメモ"></textarea>
      </div>
      <div class="timetable-modal-actions">
        <button type="button" class="btn-timetable-clear" id="timetable-slot-clear">クリア</button>
        <button type="submit" class="btn-compose">保存</button>
      </div>
    </form>
  </div>
</div>

<style>
  button.nav-item {
    border: none;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-nav .nav-item {
    padding: 2px 0;
    font-size: 8px;
  }
  .bottom-nav .nav-item span {
    max-width: 56px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav-item--notify { position: relative; }
  .nav-badge {
    position: absolute;
    top: 0;
    right: calc(50% - 20px);
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: #891E2B;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
  }
</style>

{% load static %}
<style>
  .wase-search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin: 0 0 12px;
    padding: 0 4px;
    box-sizing: border-box;
  }
  .wase-search-bar__field {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .wase-search-bar__input {
    width: 100%;
    height: 40px;
    padding: 0 44px 0 14px;
    border: 1px solid #d8dee6;
    border-radius: 999px;
    background: #fff;
    font-size: 14px;
    font-family: inherit;
    color: var(--text, #0f1419);
    box-sizing: border-box;
  }
  .wase-search-bar__input:focus {
    outline: none;
    border-color: var(--accent, #891e2b);
    box-shadow: 0 0 0 3px rgba(137, 30, 43, 0.12);
  }
  .wase-search-bar__submit {
    position: absolute;
    top: 50%;
    right: 4px;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--accent, #891e2b);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .wase-search-bar__submit:hover,
  .wase-search-bar__submit:focus-visible {
    background: rgba(137, 30, 43, 0.08);
    outline: none;
  }
  .wase-search-bar__submit svg {
    fill: currentColor;
    display: block;
  }
  .wase-search-bar.is-loading .wase-search-bar__submit {
    opacity: 0.55;
    pointer-events: none;
  }
  .wase-search-panel {
    margin: 0 4px 16px;
  }
  .wase-search-panel[hidden] {
    display: none !important;
  }
  .wase-search-status {
    margin: 0 0 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #f7f9fc;
    color: var(--muted, #536471);
    font-size: 13px;
    line-height: 1.5;
  }
  .wase-search-status.is-loading {
    color: var(--accent, #891e2b);
    font-weight: 700;
  }
  .wase-search-status.is-empty {
    background: #fff8e6;
    border: 1px solid #f0e0a8;
    color: #7a5b00;
  }
  .wase-search-results {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .wase-search-result {
    background: var(--card, #fff);
    border: 1px solid #eff3f4;
    border-radius: 12px;
    overflow: hidden;
  }
  .wase-search-result a {
    display: block;
    padding: 12px 14px;
    text-decoration: none;
    color: inherit;
  }
  .wase-search-result a:hover,
  .wase-search-result a:focus-visible {
    background: #f7f9fc;
  }
  .wase-search-result__title {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text, #0f1419);
  }
  .wase-search-result__subtitle {
    margin: 0;
    font-size: 12px;
    line-height: 1.45;
    color: var(--muted, #536471);
  }
  .wase-search-result__meta {
    margin: 6px 0 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent, #891e2b);
  }
</style>

<form
  class="wase-search-bar"
  data-search-bar
  data-search-scope="{{ search_scope }}"
  {% if search_faculty %}data-search-faculty="{{ search_faculty }}"{% endif %}
  data-search-api="{% url 'api_search' %}"
  role="search"
  action="{% url 'api_search' %}"
  method="get"
>
  <div class="wase-search-bar__field">
    <label class="visually-hidden" for="{{ search_input_id|default:'wase-search-q' }}">検索</label>
    <input
      class="wase-search-bar__input"
      id="{{ search_input_id|default:'wase-search-q' }}"
      type="search"
      name="q"
      value="{{ search_query|default:'' }}"
      placeholder="{{ search_placeholder|default:'キーワードで検索' }}"
      autocomplete="off"
      enterkeyhint="search"
      data-search-input
    >
    <button class="wase-search-bar__submit" type="submit" aria-label="検索" data-search-submit>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
    </button>
  </div>
</form>

<div class="wase-search-panel" data-search-panel hidden>
  <p class="wase-search-status" data-search-status aria-live="polite"></p>
  <ul class="wase-search-results" data-search-results></ul>
</div>

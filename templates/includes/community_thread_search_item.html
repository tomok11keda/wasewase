{% load wase_extras %}
<article class="community-thread-item community-thread-item--search" id="thread-{{ thread.pk }}">
  <a
    class="community-thread-item__link"
    href="{% url 'community_thread_detail' thread.community.slug thread.pk %}"
  >
    <span class="community-badge">{{ thread.community.name }}</span>
    <h3 class="community-thread-item__title">{{ thread.title }}</h3>
    <p class="community-thread-item__preview">{{ thread.body|truncatechars:160 }}</p>
  </a>
  <p class="community-thread-item__meta">
    <a class="community-thread-item__author" href="{% url 'user_profile' thread.author.pk %}">{{ thread.author|display_name }}</a>
    <span aria-hidden="true">·</span>
    <time datetime="{{ thread.created_at|date:'c' }}">{{ thread.created_at|timesince }}前</time>
    {% if thread.replies_count %}
    <span aria-hidden="true">·</span>
    <span>返信 {{ thread.replies_count }}</span>
    {% endif %}
  </p>
</article>
